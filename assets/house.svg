<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="group" aria-label="Interactive blue house, two windows, red roof, garden and walkway">
  <defs>
    <style>.window rect{fill:#a7e3ed;stroke:#285778;stroke-width:4}.window line{stroke:#285778;stroke-width:3}</style>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#bfe5f4"/>
  <rect x="0" y="390" width="800" height="110" fill="#8ecc88"/>
  <g data-part="sun">
    <circle cx="695" cy="83" r="44" fill="#f8d66d"/>
  </g>
  <g data-part="cloud">
    <ellipse cx="155" cy="95" rx="70" ry="23" fill="white"/>
    <ellipse cx="212" cy="100" rx="47" ry="18" fill="white"/>
  </g>
  <g data-part="walls">
    <rect x="220" y="205" width="365" height="205" rx="4" fill="#4b91b3" stroke="#235372" stroke-width="5"/>
  </g>
  <g data-part="roof">
    <polygon points="190,215 402,95 615,215" fill="#cc5854" stroke="#8f3738" stroke-width="5"/>
    <rect x="505" y="111" width="48" height="65" fill="#a84a44"/>
  </g>
  <g data-part="door">
    <rect x="371" y="305" width="70" height="105" fill="#734d40"/>
    <circle cx="428" cy="357" r="4" fill="#f6dc78"/>
  </g>
  <g class="window">
    <g data-part="left-window" transform="translate(270 265)">
      <rect x="0" y="0" width="65" height="60"/>
      <line x1="32.5" y1="0" x2="32.5" y2="60"/>
      <line x1="0" y1="30" x2="65" y2="30"/>
    </g>
    <g data-part="right-window" transform="translate(475 265)">
      <rect x="0" y="0" width="65" height="60"/>
      <line x1="32.5" y1="0" x2="32.5" y2="60"/>
      <line x1="0" y1="30" x2="65" y2="30"/>
    </g>
  </g>
  <g data-part="walkway">
    <path d="M385 410 C400 440 375 465 330 500 L500 500 C465 466 452 439 428 410 Z" fill="#d9cbb3"/>
  </g>
  <g data-part="left-flowers">
    <line x1="75" y1="395" x2="75" y2="340" stroke="#397157" stroke-width="5"/>
    <circle cx="75" cy="335" r="18" fill="#ed6a76"/>
    <circle cx="90" cy="347" r="11" fill="#f5b84b"/>
  </g>
  <g data-part="right-flower">
    <line x1="690" y1="395" x2="690" y2="332" stroke="#397157" stroke-width="5"/>
    <circle cx="690" cy="328" r="20" fill="#ed6a76"/>
  </g>
  <text x="24" y="470" fill="#234f39" font-size="20" font-weight="700">Home sweet home</text>
</svg>
